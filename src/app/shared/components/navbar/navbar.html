<header class="topbar">
  <div class="breadcrumb-wrap">
    <p class="breadcrumb">Workspace <span>/</span> {{ title }}</p>
    <h2>{{ title }}</h2>
  </div>

  <div class="topbar-right">
    <span class="open-status"><span class="online-dot"></span> Open now</span>
    <span class="topbar-divider" aria-hidden="true"></span>
    <a class="topbar-action" routerLink="/settings" aria-label="Go to settings">Settings</a>
    <span class="topbar-avatar" aria-label="Logged in staff">AM</span>
  </div>
</header>
